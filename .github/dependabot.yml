version: 2
updates:
  # Keep actions/* pins (checkout, setup-python, setup-node, ...) fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Root package.json (npm distribution metadata).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # server/requirements.txt — the pip ecosystem supports requirements.txt
  # manifests; `directory` points at the folder that contains it.
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    ignore:
      # The engine's supported floor is Python 3.9 (CI matrix includes it), and
      # jsonschema 4.26+ requires >=3.10 — a floor bump past 4.25.1 is
      # uninstallable on 3.9 and every such PR is red by construction. Bumps up
      # to 4.25.1 still arrive (see #6); drop this rule when 3.9 support ends.
      - dependency-name: "jsonschema"
        versions: [">= 4.26.0"]
