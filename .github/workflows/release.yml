name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Manifest drift gate
        run: python scripts/pack.py --check-only
      - name: Build artifact + SHA256SUMS
        run: python scripts/pack.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with the pinned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt
          --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Publish to npm (skipped when NPM_TOKEN secret is unset)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
