name: Release

on:
  push:
    tags: ["v*"]
  # Re-publish an existing tag after a transient failure, without moving a
  # public tag: `gh workflow run release.yml -f tag=v0.4.1`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.4.1"
        required: true
        type: string

# contents: write -> GitHub Releases; id-token: write -> npm provenance
# (provenance attestation requires the OIDC token and a tag-push trigger,
# which this workflow has).
permissions:
  contents: write
  id-token: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  # Same bar as CI: nothing is published unless the full gate passes first.
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test runner + optional engine upgrades (from the manifest)
        working-directory: server
        run: |
          python -m pip install --upgrade pip pytest coverage
          python -m pip install -r requirements.txt
      - name: Test suite (discovery)
        working-directory: server
        run: python -m pytest -q
      - name: Lint (pinned ruff — same pin as ci.yml)
        run: |
          python -m pip install "ruff==0.16.4"
          ruff check .
      - name: Composite hard gate (conformance + symbols + baseline scan)
        run: python server/guard_cli.py gate --root .
      - name: Manifest drift gate
        run: python scripts/pack.py --check-only
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm smoke (pack + global install + MCP stdio round-trip)
        shell: bash
        run: |
          set -euo pipefail
          node --check bin/cli.js
          TARBALL="$(npm pack --silent)"
          test -n "$TARBALL"
          npm install -g "$TARBALL"
          node scripts/smoke_npm.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build artifact + SHA256SUMS (manifest drift checked in verify)
        run: python scripts/pack.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
      - name: Create (or update, when re-running a tag) GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — refreshing assets and title."
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release view "$RELEASE_TAG" --json body -q .body > release-notes.md
            if [ -s release-notes.md ]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            else
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
            fi
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --title "$RELEASE_TAG" --generate-notes
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      # A release that skips its published artifact but reports success is the
      # exact false green this plugin exists to prevent, so an unconfigured
      # npm path fails the run instead of passing quietly. The ONLY deliberate
      # skip is the operator switch below (repository variable
      # NPM_PUBLISH_ENABLED=false): an explicit decision, reported loudly in
      # the run, never a missing-credential surprise.
      - name: Require npm publishing to be configured
        if: ${{ vars.NPM_PUBLISH_ENABLED != 'false' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LEAKS="$(npm pack --dry-run --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const files=(JSON.parse(s)[0]?.files)||[];const bad=files.filter(f=>/(^|\/)(\.agentseed|\.agentseed_cache|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)(\/|$)|(^|\/)verification-log\.jsonl$|\.pyc$|\.log$/.test(f.path)).map(f=>f.path);console.log(JSON.stringify(bad));});')"
          if [ "$LEAKS" != "[]" ]; then
            echo "::error::The npm artifact would ship maintainer-local state: ${LEAKS}"
            echo "::error::Add a nested .npmignore in the owning directory, mirroring the scripts/pack.py skip lists, then re-run."
            exit 1
          fi
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not configured on this repository, so ${NAME}@${VERSION} would never reach npm while this run still reported success. Add the secret (or switch this workflow to npm trusted publishing / OIDC) and re-run."
            exit 1
          fi
      # Provenance is only attested on a real tag push: that is the trigger
      # whose OIDC ref actually names the released tag.
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH_ENABLED != 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event_name == 'push' && '--provenance' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          LEAKS="$(npm pack --dry-run --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const files=(JSON.parse(s)[0]?.files)||[];const bad=files.filter(f=>/(^|\/)(\.agentseed|\.agentseed_cache|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)(\/|$)|(^|\/)verification-log\.jsonl$|\.pyc$|\.log$/.test(f.path)).map(f=>f.path);console.log(JSON.stringify(bad));});')"
          if [ "$LEAKS" != "[]" ]; then
            echo "::error::The npm artifact would ship maintainer-local state: ${LEAKS}"
            echo "::error::Add a nested .npmignore in the owning directory, mirroring the scripts/pack.py skip lists, then re-run."
            exit 1
          fi
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if curl -fsS "https://registry.npmjs.org/${NAME}/${VERSION}" >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on the registry — comparing contents."
            PUBLISHED="$(curl -fsS "https://registry.npmjs.org/${NAME}/${VERSION}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).dist.shasum))')"
            LOCAL_TARBALL="$(npm pack --silent)"
            LOCAL="$(node -e 'const c=require("crypto"),f=require("fs");console.log(c.createHash("sha1").update(f.readFileSync(process.argv[1])).digest("hex"))' "$LOCAL_TARBALL")"
            if [ "$PUBLISHED" = "$LOCAL" ]; then
              echo "Identical tarball (shasum $PUBLISHED): already published, nothing to do."
              exit 0
            fi
            echo "::error::${NAME}@${VERSION} exists on npm with different contents (published $PUBLISHED, built $LOCAL). Bump the version; never overwrite."
            exit 1
          fi
          npm publish --access public ${PROVENANCE}
      - name: npm publish status (loud, never silent)
        if: always()
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          if [ "${{ vars.NPM_PUBLISH_ENABLED }}" = "false" ]; then
            echo "::notice::npm publishing is DISABLED for this run by the repository variable NPM_PUBLISH_ENABLED=false — an explicit operator decision."
            echo "::notice::The npm package stays at its currently published version. To publish: add the NPM_TOKEN secret, set NPM_PUBLISH_ENABLED=true, then run: gh workflow run release.yml -f tag=${RELEASE_TAG}"
          else
            echo "npm publishing enabled for this run."
          fi

  # Every release mirrors to Gitee and GitCode automatically. Tokens come from
  # repository secrets (MIRROR_GITEE_TOKEN / MIRROR_GITCODE_TOKEN); an
  # unconfigured mirror is a loud notice, not a failure — mirrors are
  # downstream copies, and one missing credential must not block the release.
  sync-mirrors:
    needs: publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all tags for mirror push
        run: git fetch --force --tags origin
      - name: Push mirrors (force — the canonical history lives on GitHub)
        env:
          GITEE_TOKEN: ${{ secrets.MIRROR_GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.MIRROR_GITCODE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ] && [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "::notice::No mirror tokens configured (MIRROR_GITEE_TOKEN / MIRROR_GITCODE_TOKEN) — mirrors were not synced."
            exit 0
          fi
          sync_one() {
            local name="$1" url="$2" attempt
            for attempt in 1 2 3; do
              if git push --force "$url" \
                  "HEAD:refs/heads/main" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
                echo "::notice::Mirror ${name} synced to ${RELEASE_TAG}."
                return 0
              fi
              echo "Mirror ${name} push attempt ${attempt} failed; retrying after backoff..."
              sleep $((attempt * 15))
            done
            return 1
          }
          failed=0
          if [ -n "${GITEE_TOKEN:-}" ]; then
            echo "Syncing Gitee mirror..."
            sync_one gitee "https://badhope:${GITEE_TOKEN}@gitee.com/badhope/agentseed-mcp.git" || failed=1
          fi
          if [ -n "${GITCODE_TOKEN:-}" ]; then
            echo "Syncing GitCode mirror..."
            sync_one gitcode "https://badhope:${GITCODE_TOKEN}@gitcode.com/badhope/agentseed-mcp.git" || failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            # Mirror hosts apply risk control to datacenter IPs (observed:
            # Gitee rejects the exact same credentials that succeed from a
            # maintainer machine), so a runner-side mirror push can fail
            # purely on network reputation. Mirrors are downstream copies —
            # the canonical repo, tag, GitHub Release and npm artifact are
            # already published — so this degrades to a LOUD warning instead
            # of painting every release red and paging the maintainer for a
            # copy that is one local command away.
            echo "::warning::One or more mirrors failed to sync from the runner. Sync from a trusted network: git push --force https://badhope:<TOKEN>@gitee.com/badhope/agentseed-mcp.git HEAD:refs/heads/main refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG} (same for gitcode.com)."
            echo "mirror-sync: PARTIAL FAILURE (see warning above)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mirror-sync: all mirrors at ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
