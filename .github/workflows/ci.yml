name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Full matrix WITH optional acceleration deps installed.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner + optional engine upgrades
        run: >
          python -m pip install --upgrade pip pytest coverage
          jsonschema pyflakes pyyaml
      - name: Test suite (with coverage of the engine package)
        run: |
          python -m coverage run --source=engine -m pytest test_guard.py test_features.py test_cli.py test_server.py test_manifests.py -q
          python -m coverage report -m

  # Degradation contract: everything must pass with ZERO third-party
  # engine deps (jsonschema/pyflakes/pyyaml absent) — stdlib fallbacks only.
  bare-env:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prove optional deps are absent
        run: |
          python -c "import importlib.util as u; missing=[m for m in ('jsonschema','pyflakes','yaml') if u.find_spec(m) is None]; assert len(missing)==3, missing"
      - run: python -m pip install pytest
      - run: python -m pytest test_guard.py test_features.py test_cli.py test_server.py test_manifests.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  # Multi-platform manifest drift gate (keeps plugin.json/package.json/server.json on one version).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/pack.py --check-only

  # Composite HARD gate — the enforcement layer behind the soft skill:
  # conformance linter + undefined-symbol sweep + hallucination scan that
  # fails only on NEW signals vs the committed baseline-scan.json.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python server/guard_cli.py gate --root .
