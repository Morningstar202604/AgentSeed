name: CI

on:
  push:
    branches: [main, master]
  pull_request:


permissions:
  contents: read

jobs:
  # Full matrix WITH optional acceleration deps installed.
  # Discovery (`python -m pytest`): a new test_*.py under server/ is picked up
  # automatically — the file list can never drift again.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner + optional engine upgrades (from the manifest)
        run: |
          python -m pip install --upgrade pip pytest coverage
          python -m pip install -r requirements.txt
      - name: Test suite (with coverage of the engine package)
        run: |
          python -m coverage run --source=engine -m pytest -q
          python -m coverage report -m

  # Degradation contract: everything must pass with ZERO third-party
  # engine deps (jsonschema/pyflakes/pyyaml absent) — stdlib fallbacks only.
  bare-env:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Prove optional deps are absent
        run: |
          python -c "import importlib.util as u; missing=[m for m in ('jsonschema','pyflakes','yaml') if u.find_spec(m) is None]; assert len(missing)==3, missing"
      - run: python -m pip install pytest
      - name: Test suite (discovery — cannot drift from the deps-above check)
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pinned ruff (same pin as release.yml — no surprise reds on new releases)
        run: python -m pip install "ruff==0.16.4"
      - run: ruff check .

  # Node / npm distribution path: bin/cli.js is what `npx agentseed-mcp`
  # actually runs, and release.yml publishes it — CI must execute it too.
  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Syntax-check the bin shim
        run: node --check bin/cli.js
      - name: Pack and globally install the published tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          test -n "$TARBALL"
          npm install -g "$TARBALL"
      - name: MCP stdio smoke test against the installed bin
        run: node scripts/smoke_npm.mjs

  # Multi-platform manifest drift gate (keeps plugin.json/package.json/server.json on one version).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python scripts/pack.py --check-only

  # Composite HARD gate — the enforcement layer behind the soft skill:
  # conformance linter + undefined-symbol sweep + hallucination scan that
  # fails only on NEW signals vs the committed baseline-scan.json.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python server/guard_cli.py gate --root .
